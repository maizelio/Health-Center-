<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Community Health Center</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    
    <header>
        <div class="logo-section">
            <div class="logo"><img src="logo.jpg" alt=""></div>
            <div>
                <h1>Community Health Center</h1>
                <p>Caring for Your Health</p>
            </div>
        </div>
        <nav>
            <a href="login.html" class="btn-login">LOGIN</a>
            <a href="signup.html" class="btn-signup">SIGN UP</a>
        </nav>
    </header>

    <main>
        <div class="auth-box">
            <h2>Sign Up</h2>
            
            <form>
                <div class="form-group">
                    <input type="text" placeholder="FULL NAME" required>
                </div>
                
                <div class="form-group">
                    <input type="email" placeholder="EMAIL" required>
                </div>
                
                <div class="form-group">
                    <input type="password" placeholder="PASSWORD" required>
                </div>
                
                <div class="form-group">
                    <input type="password" placeholder="CONFIRM PASSWORD" required>
                </div>
                
                <div class="form-group checkbox">
                    <input type="checkbox" id="agree-signup">
                    <label for="agree-signup">I agree to the Terms of Services and Privacy Policy</label>
                </div>
                
                <div class="form-buttons">
                    <button type="submit" class="btn-primary">SIGN UP</button>
                    <a href="login.html" class="btn-link">LOGIN</a>
                </div>
            </form>
            
            <div class="divider">or</div>
            
            <div class="social-login">
                <button class="btn-social google">
                    <img src="google logo.webp" alt="Google">
                    Continue with Google
                </button>
                <button class="btn-social facebook">
                    <img src="facebook logo.png" alt="Facebook">
                    Continue with Facebook
                </button>
            </div>
            
            <div class="form-footer">
                <span>Already have an account? <a href="login.html">Login</a></span>
                <a href="healthcenter.html">Back</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Community Health Center. All rights reserved.</p>
    </footer>

</body>
</html>
